AWSTemplateFormatVersion: "2010-09-09"
Description: Lambda-backed API for sethcharleston.com dynamic events, songs, and text.

Parameters:
  ProjectName:
    Type: String
    Default: sethcharleston
    AllowedPattern: "^[a-z0-9-]+$"
  Environment:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
  ApiDomainName:
    Type: String
    Default: api.sethcharleston.com
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: Existing us-east-1 ACM certificate ARN for API and hosted auth custom domains. Leave blank to create a new DNS-validated certificate.
  HostedAuthDomainName:
    Type: String
    Default: ""
    Description: Optional Cognito hosted UI custom domain, for example login-staging.sethcharleston.com.
  EditorCallbackUrl:
    Type: String
    Default: https://edit.sethcharleston.com
    Description: Callback URL for the editor app after Cognito hosted UI login.
  EventsTableName:
    Type: String
    Default: seth_charleston_events
  MusicTableName:
    Type: String
    Default: seth_charleston_music
  TextTableName:
    Type: String
    Default: seth_charleston_text
  SiteBucketName:
    Type: String
    Default: sethcharleston.com
  SiteDomainName:
    Type: String
    Default: sethcharleston.com
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for the apex domain. Leave blank to use the execute-api URL.
  AllowedAdminEmails:
    Type: String
    Default: "art12354@gmail.com,seth.charleston@gmail.com"
    Description: Comma-separated lowercase email addresses allowed to be created in the admin user pool.

Conditions:
  UseCustomDomain: !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateCertificate: !And
    - !Condition UseCustomDomain
    - !Equals [!Ref ApiCertificateArn, ""]
  UseProvidedCertificate: !And
    - !Condition UseCustomDomain
    - !Not [!Equals [!Ref ApiCertificateArn, ""]]
  UseHostedAuthDomain: !And
    - !Condition UseCustomDomain
    - !Not [!Equals [!Ref HostedAuthDomainName, ""]]

Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref EventsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event
          AttributeType: S
      KeySchema:
        - AttributeName: event
          KeyType: HASH

  MusicTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref MusicTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: song
          AttributeType: S
      KeySchema:
        - AttributeName: song
          KeyType: HASH

  TextTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TextTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: location
          AttributeType: S
      KeySchema:
        - AttributeName: location
          KeyType: HASH

  AdminUserAllowlistRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AdminUserAllowlist:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-admin-user-allowlist"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AdminUserAllowlistRole.Arn
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          ALLOWED_ADMIN_EMAILS: !Ref AllowedAdminEmails
      Code:
        ZipFile: |
          import os
          def handler(event, context):
              allowed = {
                  email.strip().lower()
                  for email in os.environ.get("ALLOWED_ADMIN_EMAILS", "").split(",")
                  if email.strip()
              }
              attrs = event.get("request", {}).get("userAttributes", {})
              email = (attrs.get("email") or event.get("userName") or "").strip().lower()
              if not allowed or email not in allowed:
                  raise Exception("Email address is not allowed for this admin user pool.")
              return event

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - AdminUserAllowlistPermission
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Environment}-admin"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        PreSignUp: !GetAtt AdminUserAllowlist.Arn

  AdminUserAllowlistPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminUserAllowlist
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-${Environment}-admin-client"
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
      CallbackURLs:
        - !Ref EditorCallbackUrl
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      SupportedIdentityProviders:
        - COGNITO

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseHostedAuthDomain
    Properties:
      Domain: !Ref HostedAuthDomainName
      UserPoolId: !Ref AdminUserPool
      CustomDomainConfig:
        CertificateArn: !If
          - UseProvidedCertificate
          - !Ref ApiCertificateArn
          - !Ref ApiCertificate

  AdminUserPoolDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: UseHostedAuthDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref HostedAuthDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt AdminUserPoolDomain.CloudFrontDistribution
        HostedZoneId: Z2FDTNDATAQYW2

  ApiHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDbAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt EventsTable.Arn
                  - !GetAtt MusicTable.Arn
                  - !GetAtt TextTable.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucketName}/uploads/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucketName}"

  ApiHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-api"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ApiHandlerRole.Arn
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          MUSIC_TABLE: !Ref MusicTable
          TEXT_TABLE: !Ref TextTable
          SITE_BUCKET: !Ref SiteBucketName
          SITE_DOMAIN: !Ref SiteDomainName
      Code:
        ZipFile: |
          import base64, hashlib, html, json, os, re
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from urllib.parse import parse_qs, urlparse
          import boto3
          db = boto3.resource("dynamodb")
          ev = db.Table(os.environ["EVENTS_TABLE"])
          mu = db.Table(os.environ["MUSIC_TABLE"])
          tx = db.Table(os.environ["TEXT_TABLE"])
          s3 = boto3.client("s3")
          media_defaults = {"home-video":"videos/Take a Seat (Website Header).mp4","home-mobile":"photos/Mobile Homepage Header (7.22.23).png","about-header":"photos/Bio Page (7.21.23).png","music-header":"photos/Music Page (7.21.23).png","shows-header":"photos/Events Page (7.21.23).png","services-header":"photos/Music Page (7.21.23).png","footer-photo":"photos/NEW Footer Photo (7.21.23).png"}
          hdr = {"Access-Control-Allow-Origin":"*","Access-Control-Allow-Headers":"Content-Type,HX-Request,HX-Trigger,HX-Trigger-Name,HX-Target,HX-Current-URL,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token","Access-Control-Allow-Methods":"GET,POST,OPTIONS","Vary":"Accept,HX-Request"}
          def out(data, code=200, content_type="application/json; charset=utf-8"):
              headers = dict(hdr); headers["Content-Type"] = content_type
              payload = data if isinstance(data, str) else json.dumps(data, default=str)
              return {"statusCode": code, "headers": headers, "body": payload}
          def esc(value): return html.escape(str(value or ""), quote=True)
          def wants_html(e):
              headers = {k.lower(): v for k, v in (e.get("headers") or {}).items()}
              query = e.get("queryStringParameters") or {}
              return headers.get("hx-request", "").lower() == "true" or "text/html" in headers.get("accept", "") or query.get("format") == "html"
          def safe_url(value):
              value = str(value or "")
              return value if urlparse(value).scheme in ("http", "https") else "#"
          def display_date(value):
              try: parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except Exception:
                  try: parsed = parsedate_to_datetime(str(value))
                  except Exception: return str(value or "")
              return parsed.strftime("%A, %B %-d, %Y")
          def render_events(items):
              items = sorted(items, key=lambda item: item.get("when", ""))
              if not items: return '<p class="col-span-full text-center text-stone-500">No shows are scheduled right now. Check back soon.</p>'
              return "".join(f'''<article class="col-span-full mx-auto w-full max-w-4xl rounded-xl bg-[#f5f5f5] p-8 text-center shadow-[0_16px_32px_rgba(0,0,0,0.35)]">
                <h2 class="font-display text-3xl text-stone-800">{esc(item.get("name"))}</h2>
                <p class="mt-3 text-sm uppercase tracking-[0.18em] text-stone-500">{esc(display_date(item.get("when")))}</p>
                <p class="mt-2 text-stone-700">{esc(item.get("where"))}</p>
                <a class="mt-6 inline-block bg-[#6b6b6b] px-6 py-3 text-sm font-bold uppercase tracking-widest text-white shadow-md transition-colors hover:bg-[#4f4f4f]" href="{esc(safe_url(item.get("tickets")))}" target="_blank" rel="noopener">Tickets</a>
              </article>''' for item in items)
          def render_songs(items):
              items = sorted(items, key=lambda item: item.get("release", ""), reverse=True)
              if not items: return '<p class="col-span-full text-center text-stone-500">New music is on the way.</p>'
              return "".join(f'<article class="col-span-full mx-auto w-full max-w-4xl overflow-hidden rounded-xl shadow-[0_16px_32px_rgba(0,0,0,0.8)]" aria-label="{esc(item.get("song"))}">{item.get("link", "")}</article>' for item in items)
          def render_services(raw):
              defaults = [{"title":"Production","description":"Full-service music production shaped around your sound, from arrangement and tracking through the final creative details."},{"title":"Mixing","description":"Detailed, musical mixes that bring clarity, depth, balance, and energy to every element of your song."},{"title":"Mastering","description":"Release-ready masters with polish, consistency, and impact across streaming platforms and playback systems."}]
              try: services = json.loads(raw) if raw else defaults
              except Exception: services = defaults
              return '<div class="grid gap-7 lg:grid-cols-3">' + "".join(f'<article class="rounded-xl bg-[#f5f5f5] p-8 shadow-[0_16px_32px_rgba(0,0,0,0.35)]"><h2 class="font-display text-4xl text-[#393939]">{esc(service.get("title"))}</h2><p class="mt-4 leading-7 text-stone-600">{esc(service.get("description"))}</p></article>' for service in services) + '</div>'
          def render_text(items, view):
              values = {item.get("location"): item.get("text", "") for item in items}
              if view == "home":
                  return f'<div><h1 id="frontPageHeader" class="font-display text-4xl text-stone-800">{values.get("frontPageHeader", "New music is coming!")}</h1><div id="frontPageText" class="mt-5 leading-8 text-stone-600">{values.get("frontPageText", "")}</div></div><div id="frontPageVideo" class="mt-12"><h2 class="font-display text-3xl text-stone-800">Newest Video</h2><div class="mt-5 overflow-hidden rounded-sm shadow-xl">{values.get("frontPageVideo", "")}</div></div>'
              if view == "bio": return values.get("bio", "")
              if view == "services": return render_services(values.get("services"))
              return "".join(item.get("text", "") for item in items)
          def body(e):
              raw = e.get("body") or "{}"
              if e.get("isBase64Encoded"): raw = base64.b64decode(raw).decode()
              if isinstance(raw, (dict, list)): return raw
              content_type = next((v for k, v in (e.get("headers") or {}).items() if k.lower() == "content-type"), "")
              if "application/x-www-form-urlencoded" in content_type:
                  parsed = parse_qs(raw, keep_blank_values=True)
                  return {k: values[-1] for k, values in parsed.items()}
              return json.loads(raw)
          def key(item, names):
              for n in names:
                  if item.get(n): return item[n]
              return None
          def handler(e, c):
              path = e.get("path", "/")
              if path == "/test1": path = "/"
              elif path.startswith("/test1/"): path = path[6:]
              if len(path) > 1 and path.endswith("/"): path = path[:-1]
              method = e.get("httpMethod", "GET")
              if method == "OPTIONS": return out({})
              try:
                  if method == "GET" and path == "/media/library":
                      slot=(e.get("queryStringParameters") or {}).get("slot", "")
                      if slot not in media_defaults: return out({"message":"unknown media slot"},400)
                      active=tx.get_item(Key={"location":"media:"+slot}).get("Item",{}).get("text") or media_defaults[slot]
                      pages=s3.get_paginator("list_objects_v2").paginate(Bucket=os.environ["SITE_BUCKET"],Prefix="uploads/"+slot+"-"); objects=[obj for page in pages for obj in page.get("Contents",[])]
                      files=[{"key":media_defaults[slot],"name":"Original","url":"https://"+os.environ["SITE_DOMAIN"]+"/"+media_defaults[slot],"active":active==media_defaults[slot],"original":True}]
                      files += [{"key":obj["Key"],"name":obj["Key"].split("/")[-1],"url":"https://"+os.environ["SITE_DOMAIN"]+"/"+obj["Key"],"active":active==obj["Key"],"size":obj.get("Size",0),"modified":str(obj.get("LastModified",""))} for obj in sorted(objects,key=lambda value:value.get("LastModified",datetime.min),reverse=True)]
                      return out({"slot":slot,"files":files})
                  if method == "GET" and path.startswith("/media/"):
                      slot=path.split("/",2)[2]
                      if slot not in media_defaults: return out({"message":"unknown media slot"},404)
                      saved=tx.get_item(Key={"location":"media:"+slot}).get("Item",{}).get("text")
                      target=saved or media_defaults[slot]
                      return {"statusCode":302,"headers":{"Location":"https://"+os.environ["SITE_DOMAIN"]+"/"+target,"Cache-Control":"no-store","Access-Control-Allow-Origin":"*"},"body":""}
                  if method == "POST" and path == "/media/upload":
                      upload=body(e); slot=str(upload.get("slot", "")); content_type=str(upload.get("contentType", "")); original=str(upload.get("name", "media"))
                      if slot not in media_defaults: return out({"message":"unknown media slot"},400)
                      expected="video/" if slot == "home-video" else "image/"
                      extension={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","video/mp4":"mp4","video/webm":"webm"}.get(content_type)
                      if not content_type.startswith(expected) or not extension: return out({"message":"unsupported file type"},400)
                      friendly=re.sub(r'[^a-zA-Z0-9._-]+','-',original.rsplit('.',1)[0]).strip('-')[:60] or 'media'
                      key=f'uploads/{slot}-{datetime.utcnow().strftime("%Y%m%d%H%M%S%f")}-{friendly}.{extension}'
                      upload_url=s3.generate_presigned_url("put_object",Params={"Bucket":os.environ["SITE_BUCKET"],"Key":key,"ContentType":content_type},ExpiresIn=300)
                      return out({"uploadUrl":upload_url,"key":key,"mediaUrl":f'/media/{slot}'})
                  if method == "POST" and path == "/media/commit":
                      upload=body(e); slot=str(upload.get("slot", "")); key=str(upload.get("key", ""))
                      if slot not in media_defaults or (key != media_defaults[slot] and not key.startswith("uploads/"+slot+"-")): return out({"message":"invalid media selection"},400)
                      if key != media_defaults[slot]: s3.head_object(Bucket=os.environ["SITE_BUCKET"],Key=key)
                      tx.put_item(Item={"location":"media:"+slot,"text":key}); return out({"mediaUrl":f'/media/{slot}'})
                  if method == "POST" and path == "/media/delete":
                      upload=body(e); slot=str(upload.get("slot", "")); key=str(upload.get("key", ""))
                      if slot not in media_defaults or not key.startswith("uploads/"+slot+"-"): return out({"message":"invalid media file"},400)
                      active=tx.get_item(Key={"location":"media:"+slot}).get("Item",{}).get("text") or media_defaults[slot]
                      if key == active: return out({"message":"select another file before deleting this one"},409)
                      s3.delete_object(Bucket=os.environ["SITE_BUCKET"],Key=key); return out({"deleted":key})
                  if method == "GET" and path == "/":
                      items = ev.scan().get("Items", [])
                      return out(render_events(items), content_type="text/html; charset=utf-8") if wants_html(e) else out({"Items": items})
                  if method == "GET" and path == "/songs":
                      items = mu.scan().get("Items", [])
                      return out(render_songs(items), content_type="text/html; charset=utf-8") if wants_html(e) else out(items)
                  if method == "GET" and path == "/text":
                      items = tx.scan().get("Items", [])
                      view = (e.get("queryStringParameters") or {}).get("view", "")
                      return out(render_text(items, view), content_type="text/html; charset=utf-8") if wants_html(e) else out(items)
                  if method == "GET" and path == "/access": return out({"ok": True})
                  item = body(e)
                  if method == "POST" and path == "/":
                      item.setdefault("event", hashlib.sha256((item.get("name","")+item.get("when","")+item.get("where","")).encode()).hexdigest())
                      ev.put_item(Item=item); return out(item)
                  if method == "POST" and path == "/songs":
                      mu.put_item(Item=item); return out(item)
                  if method == "POST" and path == "/text":
                      items = item if isinstance(item, list) else [item]
                      for text_item in items: tx.put_item(Item=text_item)
                      return out(items)
                  if method == "POST" and path == "/delete":
                      k = key(item, ["event", "name"])
                      ev.delete_item(Key={"event": k}); return out({"deleted": k})
                  if method == "POST" and path == "/delete_song":
                      k = key(item, ["song"])
                      mu.delete_item(Key={"song": k}); return out({"deleted": k})
                  return out({"message": "not found"}, 404)
              except Exception as ex:
                  return out({"message": str(ex)}, 500)

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "${ProjectName} ${Environment} Lambda API"
      EndpointConfiguration:
        Types:
          - EDGE

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: login
      RestApiId: !Ref RestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt AdminUserPool.Arn

  SongsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: songs

  TextResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: text

  DeleteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: delete

  DeleteSongResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: delete_song

  AccessResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: access

  MediaResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !GetAtt RestApi.RootResourceId, PathPart: media}
  MediaSlotResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref MediaResource, PathPart: "{slot}"}
  MediaLibraryResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref MediaResource, PathPart: library}
  MediaUploadResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref MediaResource, PathPart: upload}
  MediaCommitResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref MediaResource, PathPart: commit}
  MediaDeleteResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref MediaResource, PathPart: delete}

  MediaSlotGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MediaSlotResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiHandler.Arn}/invocations"}
  MediaLibraryGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MediaLibraryResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiHandler.Arn}/invocations"}
  MediaUploadPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MediaUploadResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiHandler.Arn}/invocations"}
  MediaCommitPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MediaCommitResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiHandler.Arn}/invocations"}
  MediaDeletePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MediaDeleteResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiHandler.Arn}/invocations"}

  MediaSlotOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MediaSlotResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: {application/json: '{"statusCode":200}'}
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters: {method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'", method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'", method.response.header.Access-Control-Allow-Origin: "'*'"}
