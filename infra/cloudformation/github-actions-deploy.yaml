AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub Actions OIDC access for deploying sethcharleston.com.

Parameters:
  GitHubOwner:
    Type: String
    Default: art12354
  GitHubRepository:
    Type: String
    Default: sethcharleston.com
  GitHubBranch:
    Type: String
    Default: master
  WebsiteBucketName:
    Type: String
    Default: sethcharleston.com
  CloudFrontDistributionId:
    Type: String
    Default: E3FWVWV0D2QOJ4
  StagingWebsiteBucketName:
    Type: String
    Default: staging.sethcharleston.com
  StagingCloudFrontDistributionId:
    Type: String
    Default: E1GQMQPCSCC703
  HostedZoneId:
    Type: String
    Default: Z27ZS6MVE7C6ZT

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sethcharleston-github-actions-deploy
      Description: Deploy staging and production from the master branch in GitHub Actions.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: DeployWebsite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListWebsiteBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${WebsiteBucketName}"
              - Sid: ListStagingWebsiteBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StagingWebsiteBucketName}"
              - Sid: WriteWebsiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${WebsiteBucketName}/*"
              - Sid: WriteStagingWebsiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StagingWebsiteBucketName}/*"
              - Sid: InvalidateWebsiteDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
              - Sid: InvalidateStagingWebsiteDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${StagingCloudFrontDistributionId}"

  GitHubActionsPreviewRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sethcharleston-github-actions-preview
      Description: Create and remove disposable frontend previews for feature branches.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/*"
      Policies:
        - PolicyName: ManagePreviewSites
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManagePreviewStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sethcharleston-preview-*/*"
              - Sid: CreatePreviewStacks
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sethcharleston-preview-*/*"
              - Sid: ManagePreviewBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetBucketWebsite
                  - s3:GetEncryptionConfiguration
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutBucketEncryption
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketWebsite
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::*.sethcharleston.com"
                  - !Sub "arn:${AWS::Partition}:s3:::*.sethcharleston.com/*"
              - Sid: ManagePreviewDistributions
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateDistribution
                Resource: "*"
              - Sid: ManagePreviewDns
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
              - Sid: ReadDnsChanges
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub "arn:${AWS::Partition}:route53:::change/*"

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN GitHub Actions repository variable.
    Value: !GetAtt GitHubActionsDeployRole.Arn
  PreviewRoleArn:
    Description: Set this as the AWS_PREVIEW_ROLE_ARN GitHub Actions repository variable.
    Value: !GetAtt GitHubActionsPreviewRole.Arn
