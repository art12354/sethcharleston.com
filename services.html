<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Music production, mixing, and mastering by Seth Charleston."
    />
    <meta name="htmx-config" content='{"selfRequestsOnly":false}' />
    <title>Seth Charleston — Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Adamina&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/site.css?v=16" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="page-services flex min-h-screen flex-col">
    <nav
      class="site-nav"
      aria-label="Main navigation"
      aria-busy="true"
      hx-get="partials/nav.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    >
      <div class="nav-shell animate-pulse">
        <div class="hidden h-10 w-80 rounded bg-white/10 md:block"></div>
        <div
          class="h-9 w-16 justify-self-center rounded bg-white/10 md:h-11"
        ></div>
        <div class="h-8 w-8 rounded bg-white/10 md:h-10 md:w-56"></div>
      </div>
    </nav>
    <header class="mt-[54px] bg-[#f5f5f5] md:mt-[88px]">
      <img
        class="h-[300px] w-full object-cover md:h-auto md:max-h-[calc(100vh-88px)]"
        src="photos/Music Page (7.21.23).png"
        alt="Seth Charleston in the studio"
      />
      <h1 class="page-title">Services</h1>
    </header>
    <main class="flex-1 bg-stone-100 px-6 pb-16 text-center">
      <section class="mx-auto max-w-4xl">
        <h2 class="font-display text-5xl">Bring Your Music to Life</h2>
        <p class="mt-4 text-stone-600">
          Thoughtful, artist-focused audio services for every stage of your
          project.
        </p>
        <div
          id="servicesList"
          class="mt-12"
          hx-get="https://api.sethcharleston.com/test1/text?view=services"
          hx-trigger="load"
          hx-swap="innerHTML"
          aria-live="polite"
        >
          <p class="htmx-indicator text-sm uppercase tracking-widest">
            Loading services…
          </p>
        </div>
        <a
          class="mt-10 inline-block bg-stone-800 px-8 py-4 text-sm font-bold uppercase tracking-widest text-white hover:bg-amber-700"
          href="mailto:seth.charleston@gmail.com"
          >Start a conversation</a
        >
      </section>
    </main>
    <footer
      class="grid min-h-[402px] animate-pulse bg-[#393939] p-8 md:grid-cols-2"
      aria-busy="true"
      hx-get="partials/footer.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    >
      <div class="m-auto h-52 w-full max-w-md rounded bg-white/10"></div>
      <div
        class="m-auto hidden h-80 w-full max-w-md rounded bg-white/10 md:block"
      ></div>
    </footer>
  </body>
</html>
