<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css?family=Dancing+Script" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Adamina" rel="stylesheet">
  <title>Seth Charleston - Services</title>
</head>
<body>
  <nav class="topNav" id="topNav">
    <div id="logo">
      <a href="index.html" class="logoWrap"><img src="photos/Seth_Charleston_Logo.png" class="logo" alt="Seth Charleston Logo" title="Seth Charleston"></a>
      <a href="javascript:void(0);" class="icon" onclick="myFunction()">&#9776;</a>
    </div>
    <div id="links">
      <a class="link" href="about.html">About</a>
      <a class="link" href="music.html">Music</a>
      <a class="link" href="shows.html">Shows</a>
      <a class="link active" href="services.html">Services</a>
    </div>
    <div id="social">
      <a href="https://twitter.com/sethcharleston" class="fa fa-twitter link" target="_blank"></a>
      <a href="https://www.facebook.com/sethcharlestonmusic/" class="fa fa-facebook link" target="_blank"></a>
      <a href="https://www.instagram.com/sethcharleston/" class="fa fa-instagram link" target="_blank"></a>
      <a href="https://open.spotify.com/artist/1A5BJhYP6UBWnqVhuJnTqy" class="fa fa-spotify link" target="_blank"></a>
      <a href="https://www.youtube.com/channel/UC1F4-aWEuIr2PRG2BP5qZDA" class="fa fa-youtube link" target="_blank"></a>
    </div>
  </nav>
  <header>
    <div id="aboveHeader"></div>
    <div id="music_img"><img src="photos/Music Page (7.21.23).png" alt="Seth Charleston in the studio" width="100%" height="100%"></div>
    <div class="spacer">Services</div>
  </header>
  <main class="main services-main">
    <section class="services-intro">
      <h1>Bring Your Music to Life</h1>
      <p>Thoughtful, artist-focused audio services for every stage of your project.</p>
    </section>
    <section id="servicesList" class="services-list" aria-live="polite"></section>
  </main>
  <footer>
    <section class="title">
      <div class="social">
        <a href="https://twitter.com/sethcharleston" class="fa fa-twitter" target="_blank"></a>
        <a href="https://www.facebook.com/sethcharlestonmusic/" class="fa fa-facebook" target="_blank"></a>
        <a href="https://www.instagram.com/sethcharleston/" class="fa fa-instagram" target="_blank"></a>
        <a href="https://open.spotify.com/artist/1A5BJhYP6UBWnqVhuJnTqy" class="fa fa-spotify" target="_blank"></a>
        <a href="https://www.youtube.com/channel/UC1F4-aWEuIr2PRG2BP5qZDA" class="fa fa-youtube" target="_blank"></a>
      </div>
      <div class="footer"><a href="mailto:seth.charleston@gmail.com">Booking &amp; Inquiries</a><br><br><a href="mailto:arthur.sommer@gmail.com">Web Development By Arthur Sommer</a></div>
    </section>
    <section class="footerImg"><img src="photos/NEW Footer Photo (7.21.23).png" alt="Seth Charleston"></section>
  </footer>
  <script>
    var defaultServices = [
      { title: "Production", description: "Full-service music production shaped around your sound, from arrangement and tracking through the final creative details." },
      { title: "Mixing", description: "Detailed, musical mixes that bring clarity, depth, balance, and energy to every element of your song." },
      { title: "Mastering", description: "Release-ready masters with polish, consistency, and impact across streaming platforms and playback systems." }
    ];
    function renderServices(services) {
      var list = document.getElementById("servicesList");
      list.innerHTML = "";
      services.forEach(function(service) {
        var card = document.createElement("article");
        card.className = "service-card";
        var title = document.createElement("h2");
        title.textContent = service.title;
        var description = document.createElement("p");
        description.textContent = service.description;
        card.append(title, description);
        list.appendChild(card);
      });
    }
    fetch("https://api.sethcharleston.com/test1/text")
      .then(function(response) { return response.json(); })
      .then(function(items) {
        var stored = items.find(function(item) { return item.location === "services"; });
        renderServices(stored ? JSON.parse(stored.text) : defaultServices);
      })
      .catch(function() { renderServices(defaultServices); });
    function myFunction() {
      var nav = document.getElementById("topNav");
      nav.className = nav.className === "topNav" ? "topNav responsive" : "topNav";
    }
  </script>
</body>
</html>
