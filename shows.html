<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Upcoming Seth Charleston shows and tickets."
    />
    <meta name="htmx-config" content='{"selfRequestsOnly":false}' />
    <title>Seth Charleston — Shows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Adamina&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/site.css?v=20" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="page-shows flex min-h-screen flex-col">
    <nav
      class="site-nav"
      aria-label="Main navigation"
      aria-busy="true"
      hx-get="partials/nav.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    >
      <div class="nav-shell animate-pulse">
        <div class="hidden h-10 w-80 rounded bg-white/10 md:block"></div>
        <div
          class="h-9 w-16 justify-self-center rounded bg-white/10 md:h-11"
        ></div>
        <div class="h-8 w-8 rounded bg-white/10 md:h-10 md:w-56"></div>
      </div>
    </nav>
    <header class="mt-[68px] bg-[#f5f5f5] lg:mt-[88px]">
      <img
        class="h-[189px] w-full object-cover md:h-auto md:max-h-[calc(100vh-88px)]"
        src="https://api.sethcharleston.com/test1/media/shows-header"
        alt="Seth Charleston live"
      />
      <h1 class="page-title">Shows</h1>
    </header>
    <main
      id="info"
      class="grid flex-1 gap-8 bg-stone-100 px-[10%] pb-[194px] lg:grid-cols-2 xl:px-24"
      hx-get="https://api.sethcharleston.com/test1/"
      hx-trigger="load"
      hx-swap="innerHTML"
      aria-live="polite"
    >
      <p
        class="htmx-indicator col-span-full text-center text-sm uppercase tracking-widest"
      >
        Loading shows…
      </p>
    </main>
    <footer
      class="grid min-h-[402px] animate-pulse bg-[#393939] p-8 md:grid-cols-2"
      aria-busy="true"
      hx-get="partials/footer.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    >
      <div class="m-auto h-52 w-full max-w-md rounded bg-white/10"></div>
      <div
        class="m-auto hidden h-80 w-full max-w-md rounded bg-white/10 md:block"
      ></div>
    </footer>
  </body>
</html>
