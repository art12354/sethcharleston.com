<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Upcoming Seth Charleston shows and tickets."
    />
    <title>Seth Charleston — Shows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Adamina&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </head>
  <body hx-config='{"selfRequestsOnly":false}' class="flex min-h-screen flex-col">
    <nav
      class="fixed inset-x-0 top-0 z-50 bg-stone-900/95 text-white shadow-lg"
      aria-label="Main navigation"
    >
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-3 md:grid md:grid-cols-3"
      >
        <div class="hidden items-center gap-6 md:flex">
          <a
            class="font-display text-2xl hover:text-amber-300"
            href="about.html"
            >About</a
          ><a
            class="font-display text-2xl hover:text-amber-300"
            href="music.html"
            >Music</a
          ><a
            class="font-display text-2xl text-amber-300"
            aria-current="page"
            href="shows.html"
            >Shows</a
          ><a
            class="font-display text-2xl hover:text-amber-300"
            href="services.html"
            >Services</a
          >
        </div>
        <a class="justify-self-center" href="index.html"
          ><img
            class="h-9 w-auto"
            src="photos/Seth_Charleston_Logo.png"
            alt="Seth Charleston"
        /></a>
        <div
          class="hidden justify-end gap-5 text-sm uppercase tracking-widest md:flex"
        >
          <a href="https://www.instagram.com/sethcharleston/">Instagram</a
          ><a href="https://open.spotify.com/artist/1A5BJhYP6UBWnqVhuJnTqy"
            >Spotify</a
          ><a href="https://www.youtube.com/channel/UC1F4-aWEuIr2PRG2BP5qZDA"
            >YouTube</a
          >
        </div>
        <details class="md:hidden">
          <summary
            class="cursor-pointer list-none text-3xl"
            aria-label="Open menu"
          >
            ☰
          </summary>
          <div
            class="absolute left-0 top-full flex w-full flex-col gap-4 bg-stone-900 px-6 py-6 text-center font-display text-3xl"
          >
            <a href="about.html">About</a><a href="music.html">Music</a
            ><a href="shows.html">Shows</a><a href="services.html">Services</a>
          </div>
        </details>
      </div>
    </nav>
    <header class="mt-[68px] bg-[#f5f5f5]">
      <img
        class="h-auto max-h-[calc(100vh-68px)] w-full object-cover"
        src="photos/Events Page (7.21.23).png"
        alt="Seth Charleston live"
      />
      <h1 class="page-title">Shows</h1>
    </header>
    <main
      id="info"
      class="grid flex-1 gap-8 bg-stone-100 px-6 py-16 lg:grid-cols-2 xl:px-24"
      hx-get="https://api.sethcharleston.com/test1/"
      hx-trigger="load"
      hx-swap="innerHTML"
      aria-live="polite"
    >
      <p
        class="htmx-indicator col-span-full text-center text-sm uppercase tracking-widest"
      >
        Loading shows…
      </p>
    </main>
    <footer class="bg-stone-900 px-6 py-10 text-center text-stone-200">
      <p class="font-display text-3xl">Seth Charleston</p>
      <p class="mt-4">
        <a class="underline" href="mailto:seth.charleston@gmail.com"
          >Booking &amp; inquiries</a
        >
      </p>
    </footer>
  </body>
</html>
