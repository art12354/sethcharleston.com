<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Official site of Los Angeles indie rock artist Seth Charleston."
    />
    <meta name="htmx-config" content='{"selfRequestsOnly":false}' />
    <title>Seth Charleston — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Adamina&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/site.css?v=14" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="page-home flex min-h-screen flex-col">
    <nav
      class="site-nav"
      aria-label="Main navigation"
      aria-busy="true"
      hx-get="partials/nav.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    >
      <div class="nav-shell animate-pulse">
        <div class="hidden h-10 w-80 rounded bg-white/10 md:block"></div>
        <div
          class="h-9 w-16 justify-self-center rounded bg-white/10 md:h-11"
        ></div>
        <div class="h-8 w-8 rounded bg-white/10 md:h-10 md:w-56"></div>
      </div>
    </nav>
    <header
      class="relative mt-[68px] overflow-hidden bg-[#393939] md:mt-[88px]"
    >
      <video
        class="hidden max-h-[calc(100vh-84px)] w-full object-cover md:block"
        autoplay
        muted
        loop
        playsinline
        poster="photos/Mobile Homepage Header (7.22.23).png"
      >
        <source
          src="videos/Take a Seat (Website Header).mp4"
          type="video/mp4"
        />
      </video>
      <img
        class="h-auto w-full md:hidden"
        src="photos/Mobile Homepage Header (7.22.23).png"
        alt="Seth Charleston performing"
      />
      <img
        class="absolute left-1/2 top-1/2 w-4/5 -translate-x-1/2 -translate-y-1/2 md:hidden"
        src="photos/Seth_Charleston.png"
        alt="Seth Charleston"
      />
    </header>
    <main class="flex-1 bg-[#f5f5f5] px-6 py-16 md:py-24">
      <section
        class="mx-auto max-w-4xl text-center text-lg md:text-2xl"
        hx-get="https://api.sethcharleston.com/test1/text?view=home"
        hx-trigger="load"
        hx-swap="innerHTML"
        aria-live="polite"
      >
        <div>
          <h1 id="frontPageHeader" class="font-display text-4xl text-stone-800">
            New music is coming!
          </h1>
          <p id="frontPageText" class="mt-5 leading-8 text-stone-600">
            Follow Seth on Spotify for the latest releases.
          </p>
        </div>
        <div id="frontPageVideo" class="mt-12">
          <h2 class="font-display text-3xl text-stone-800">Newest Video</h2>
        </div>
        <p
          class="htmx-indicator mt-8 text-sm uppercase tracking-widest text-stone-500"
        >
          Loading latest news…
        </p>
      </section>
    </main>
    <footer
      class="grid min-h-[402px] animate-pulse bg-[#393939] p-8 md:grid-cols-2"
      aria-busy="true"
      hx-get="partials/footer.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    >
      <div class="m-auto h-52 w-full max-w-md rounded bg-white/10"></div>
      <div
        class="m-auto hidden h-80 w-full max-w-md rounded bg-white/10 md:block"
      ></div>
    </footer>
  </body>
</html>
