<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css?family=Dancing Script" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Adamina" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  <script src="js/login.js"></script>
  <script src="js/send_front_page_data.js"></script>
  <script src="js/generateFrontPage.js"></script>
  <script src="js/send_bio_data.js"></script>
  <script src="js/generateBio.js"></script>
  <script src="js/send_event_data.js"></script>
  <script src="js/generateEvents.js"></script>
  <script src="js/editEvent.js"></script>
  <script src="js/deleteEvent.js"></script>
  <script src="js/send_song_data.js"></script>
  <script src="js/generateSongs.js"></script>
  <script src="js/editSong.js"></script>
  <script src="js/deleteSong.js"></script>
  <title>Seth Charleston - Website Editor</title>
</head>

<body class="editor-page" onload="generateFrontPage()">
  <nav class="topNav" id="topNav">
    <div id="logo">
      <a href="https://sethcharleston.com" class="logoWrap"><img src="https://sethcharleston.com/photos/Seth_Charleston_Logo.png" class="logo" alt="Seth Charleston Logo" title="Seth Charleston"></a>
      <a href="javascript:void(0);" class="icon" onclick="myFunction()">&#9776;</a>
    </div>
    <div id="links">
      <a class="link active" href="#front_page" onclick="showEditorPane('front_page', generateFrontPage); return false;">Home</a>
      <a class="link" href="#bio" onclick="showEditorPane('bio', generateBio); return false;">About</a>
      <a class="link" href="#music" onclick="showEditorPane('music', generateSongs); return false;">Music</a>
      <a class="link" href="#events" onclick="showEditorPane('events', generateEvents); return false;">Shows</a>
    </div>
    <div id="social">
      <a href="https://twitter.com/sethcharleston" class="fa fa-twitter link" target="_blank"></a>
      <a href="https://www.facebook.com/sethcharlestonmusic/" class="fa fa-facebook link" target="_blank"></a>
      <a href="https://www.instagram.com/sethcharleston/" class="fa fa-instagram link" target="_blank"></a>
      <a href="https://open.spotify.com/artist/1A5BJhYP6UBWnqVhuJnTqy?si=9cBSwHBCSJWLlZbhqA3g2g" class="fa fa-spotify link" target="_blank"></a>
      <a href="https://www.youtube.com/channel/UC1F4-aWEuIr2PRG2BP5qZDA" class="fa fa-youtube link" target="_blank"></a>
    </div>
  </nav>

  <header class="editor-hero">
    <div id="aboveHeader"></div>
    <video autoplay muted loop>
      <source src="https://sethcharleston.com/videos/Take%20a%20Seat%20(Website%20Header).mp4" type="video/mp4">
    </video>
    <div id="homeImage">
      <img src="https://sethcharleston.com/photos/Mobile Homepage Header (7.22.23).png" alt="" width="100%" height="100%">
    </div>
    <img class="words" src="https://sethcharleston.com/photos/Seth_Charleston.png" alt="Seth Charleston">
  </header>

  <main class="editor-main">
    <section class="editor-shell">
      <div class="editor-heading">
        <h1>Website Editor</h1>
        <button type="button" onclick="login()" class="editor-login editor-login-inline" id="loginMobile">Sign In</button>
      </div>

      <div class="tab-content editor-content">
        <div class="tab-pane active" id="front_page">
          <div class="editor-grid">
            <div class="editor-panel">
              <h2>Home Content</h2>
              <label for="frontPageHeader">Header</label>
              <textarea rows="1" id="frontPageHeader"></textarea>
              <label for="frontPageText">Main Text</label>
              <textarea rows="10" id="frontPageText"></textarea>
              <label for="frontPageVideo">Newest Video Embed</label>
              <textarea rows="2" id="frontPageVideo"></textarea>
              <button type="submit" class="editor-action" onclick="send_front_page_data()">Save Home</button>
              <div id="frontPageAlert" class="editor-alert"></div>
            </div>
            <div class="editor-panel editor-preview">
              <h2>Preview</h2>
              <div id="frontPageHeaderInfo"></div>
              <div id="frontPageTextInfo"></div>
              <div id="frontPageVideoInfo"></div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="bio">
          <div class="editor-grid">
            <div class="editor-panel">
              <h2>About Content</h2>
              <label for="bioText">Bio Text</label>
              <textarea rows="12" id="bioText"></textarea>
              <button type="submit" class="editor-action" onclick="send_bio_data()">Save About</button>
              <div id="bioAlert" class="editor-alert"></div>
            </div>
            <div class="editor-panel editor-preview">
              <h2>Preview</h2>
              <div id="bioInfo"></div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="events">
          <div class="editor-grid">
            <div class="editor-panel">
              <h2>Show Details</h2>
              <label for="event">Event</label>
              <input type="text" placeholder="The Seth Charleston Band at Coachman's!" id="event">
              <input type="hidden" id="key">
              <label for="date">Date</label>
              <input type="date" id="date">
              <label for="time">Time</label>
              <input type="time" placeholder="7:00 pm" id="time">
              <label for="where">Where</label>
              <input type="text" placeholder="Coachman's" id="where">
              <label for="tickets">Tickets</label>
              <input type="url" placeholder="https://ticketmaster.com" id="tickets">
              <button type="submit" onclick="send_event_data()" class="editor-action">Save Show</button>
              <div id="eventAlert" class="editor-alert"></div>
            </div>
            <div class="editor-panel editor-preview">
              <h2>Shows</h2>
              <div id="eventInfo" class="editor-list"></div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="music">
          <div class="editor-grid">
            <div class="editor-panel">
              <h2>Music Details</h2>
              <label for="song">Song/Album Name</label>
              <input type="text" placeholder="Jungle" id="song">
              <label for="link">Spotify Embed HTML</label>
              <input type="text" placeholder="<iframe ...></iframe>" id="link">
              <label for="releaseDate">Release Date</label>
              <input type="date" placeholder="12/3/2018" id="releaseDate">
              <button type="submit" onclick="send_song_data()" class="editor-action">Save Music</button>
              <div id="songAlert" class="editor-alert"></div>
            </div>
            <div class="editor-panel editor-preview">
              <h2>Music</h2>
              <div id="songInfo" class="editor-list"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <section class="title">
      <div class="social">
        <a href="https://twitter.com/sethcharleston" class="fa fa-twitter" target="_blank"></a>
        <a href="https://www.facebook.com/sethcharlestonmusic/" class="fa fa-facebook" target="_blank"></a>
        <a href="https://www.instagram.com/sethcharleston/" class="fa fa-instagram" target="_blank"></a>
        <a href="https://open.spotify.com/artist/1A5BJhYP6UBWnqVhuJnTqy?si=9cBSwHBCSJWLlZbhqA3g2g" class="fa fa-spotify" target="_blank"></a>
        <a href="https://www.youtube.com/channel/UC1F4-aWEuIr2PRG2BP5qZDA" class="fa fa-youtube" target="_blank"></a>
      </div>
      <div class="footer"><a href="mailto:seth.charleston@gmail.com">Booking</a><br><br><a href="mailto:arthur.sommer@gmail.com">Web Development By Arthur Sommer</a></div>
    </section>
    <section class="footerImg">
      <img src="https://sethcharleston.com/photos/NEW Footer Photo (7.21.23).png" alt="Seth Charleston">
    </section>
  </footer>

  <script>
    function showEditorPane(paneId, generator) {
      document.querySelectorAll("#links .link").forEach(function(link) {
        link.classList.toggle("active", link.getAttribute("href") === "#" + paneId);
      });
      document.querySelectorAll(".tab-pane").forEach(function(pane) {
        pane.classList.remove("active", "show");
      });
      var pane = document.getElementById(paneId);
      if (pane) {
        pane.classList.add("active", "show");
      }
      if (typeof generator === "function") {
        generator();
      }
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", "#" + paneId);
      }
      var nav = document.getElementById("topNav");
      if (nav && nav.className.indexOf("responsive") !== -1) {
        nav.className = "topNav";
      }
    }

    function myFunction() {
      var x = document.getElementById("topNav");
      if (x.className === "topNav") {
        x.className += " responsive";
      } else {
        x.className = "topNav";
      }
    }
  </script>
</body>

</html>
