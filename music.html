  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Listen to music by Seth Charleston." />
    <meta name="htmx-config" content='{"selfRequestsOnly":false}' />
    <title>Seth Charleston — Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Adamina&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css?v=6" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="flex min-h-screen flex-col">
    <nav class="site-nav" aria-label="Main navigation">
      <div class="nav-shell">
        <div class="hidden items-center gap-6 md:flex">
          <a
            class="font-display text-2xl hover:text-amber-300"
            href="about.html"
            >About</a
          ><a
            class="font-display text-2xl text-amber-300"
            aria-current="page"
            href="music.html"
            >Music</a
          ><a
            class="font-display text-2xl hover:text-amber-300"
            href="shows.html"
            >Shows</a
          ><a
            class="font-display text-2xl hover:text-amber-300"
            href="services.html"
            >Services</a
          >
        </div>
        <a class="justify-self-center" href="index.html"
          ><img
            class="h-9 w-auto"
            src="photos/Seth_Charleston_Logo.png"
            alt="Seth Charleston"
        /></a>
        <div
          class="hidden justify-end gap-5 text-sm uppercase tracking-widest md:flex"
        >
          <a href="https://www.instagram.com/sethcharleston/">Instagram</a
          ><a href="https://open.spotify.com/artist/1A5BJhYP6UBWnqVhuJnTqy"
            >Spotify</a
          ><a href="https://www.youtube.com/channel/UC1F4-aWEuIr2PRG2BP5qZDA"
            >YouTube</a
          >
        </div>
        <details class="md:hidden">
          <summary
            class="cursor-pointer list-none text-3xl"
            aria-label="Open menu"
          >
            ☰
          </summary>
          <div
            class="absolute left-0 top-full flex w-full flex-col gap-4 bg-stone-900 px-6 py-6 text-center font-display text-3xl"
          >
            <a href="about.html">About</a><a href="music.html">Music</a
            ><a href="shows.html">Shows</a><a href="services.html">Services</a>
          </div>
        </details>
      </div>
    </nav>
    <header class="mt-[54px] bg-[#f5f5f5] md:mt-[88px]">
      <img
        class="h-[189px] w-full object-cover md:h-auto md:max-h-[calc(100vh-88px)]"
        src="photos/Music Page (7.21.23).png"
        alt="Seth Charleston performing"
      />
      <h1 class="page-title">Music</h1>
    </header>
    <main
      id="info"
      class="grid flex-1 gap-8 bg-stone-100 px-[10%] md:grid-cols-2 xl:grid-cols-3"
      hx-get="https://api.sethcharleston.com/test1/songs"
      hx-trigger="load"
      hx-swap="innerHTML"
      aria-live="polite"
    >
      <p
        class="htmx-indicator col-span-full text-center text-sm uppercase tracking-widest"
      >
        Loading music…
      </p>
      <noscript
        ><p class="col-span-full text-center">
          Listen on
          <a
            class="underline"
            href="https://open.spotify.com/artist/1A5BJhYP6UBWnqVhuJnTqy"
            >Spotify</a
          >.
        </p></noscript
      >
    </main>
    <footer class="grid bg-[#393939] text-stone-200 md:grid-cols-2">
      <div
        class="flex flex-col items-center justify-center gap-8 px-8 py-12 text-center"
      >
        <h2 class="font-display text-4xl">Stay in the loop</h2>
        <form
          class="flex w-full max-w-md flex-col gap-3 sm:flex-row"
          action="https://sethcharleston.us19.list-manage.com/subscribe/post?u=0c8404aae0a66221037b9174b&amp;id=e6ff11268b"
          method="post"
          target="_blank"
        >
          <label class="sr-only" for="footer-email">Email address</label
          ><input
            class="min-w-0 flex-1 rounded-sm border-0 px-4 py-3 text-stone-900"
            id="footer-email"
            name="EMAIL"
            type="email"
            placeholder="Email address"
            required
          /><button
            class="bg-amber-700 px-6 py-3 text-sm font-bold uppercase tracking-widest hover:bg-amber-600"
            type="submit"
          >
            Subscribe
          </button>
        </form>
        <p class="text-sm">
          <a class="underline" href="mailto:seth.charleston@gmail.com"
            >Booking &amp; inquiries</a
          >
        </p>
      </div>
      <div class="hidden items-center justify-center p-8 md:flex">
        <img
          class="max-h-96 w-full max-w-md object-cover object-top shadow-[0_16px_32px_rgba(0,0,0,0.8)]"
          src="photos/NEW Footer Photo (7.21.23).png"
          alt="Seth Charleston"
        />
      </div>
    </footer>
  </body>
</html>
